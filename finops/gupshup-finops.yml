meters:
- name: whatsapp_messages
  description: WhatsApp messages billed per message; rate depends on category (marketing/utility/authentication/service) and destination country, plus Gupshup platform fee.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - app
  - category
  - country
- name: meta_message_fee
  description: The Meta per-message component of a WhatsApp send, telescopic for utility/authentication.
  unit: messages
  aggregation: sum
  dimensions:
  - category
  - country
- name: gupshup_platform_fee
  description: The Gupshup / BSP platform fee added per message.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - app
- name: sms_messages
  description: SMS messages billed per segment by country and route.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - country
- name: rcs_messages
  description: RCS messages billed per message by type and country.
  unit: messages
  aggregation: sum
  dimensions:
  - account
  - country
principles:
- name: Visibility
  description: Track message volume and spend broken down by channel, app, message category, and destination country; reconcile Meta fee vs Gupshup fee components.
- name: Allocation
  description: Name apps per team/use-case so per-message spend maps to internal cost centers and campaigns.
- name: Optimization
  description: Prefer free service-window and utility messages over marketing; consolidate volume to reach lower telescopic tiers; retire deprecating /sm SMS routes; right-size opt-in lists to avoid wasted sends.
- name: Accountability
  description: Assign owners per app/campaign; review monthly wallet burn against budget and message quality rating (which affects tier and deliverability).
