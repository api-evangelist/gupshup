description: >-
  FinOps view of Gupshup spend. Gupshup is a usage-based conversational messaging
  platform: cost accrues per message per channel. For WhatsApp, each billable
  message carries two stacked components - the Meta per-message rate (which
  depends on message category: marketing, utility, authentication, service; and on
  the destination country) plus a Gupshup platform / BSP fee. Since Meta's July
  2025 shift to per-message billing, utility and authentication categories use
  telescopic (volume-tiered) rates, so higher monthly volume lowers the unit rate.
  SMS and RCS accrue their own per-message rates by country and route. Accounts
  are wallet / prepaid-credit funded. The dominant cost drivers are message volume,
  category mix, and destination geography rather than any flat API subscription.
notes: >-
  Per-message rates are not reconciled here - they change frequently and vary by
  country and category. Verify against Gupshup's pricing pages and Meta's WhatsApp
  pricing schedule. The largest optimization levers are shifting eligible traffic
  into free service-window / utility messages, minimizing marketing-category
  sends, and consolidating volume to reach lower telescopic tiers.
