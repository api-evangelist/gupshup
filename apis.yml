  baseURL: https://partner.gupshup.io/partner
  properties:
  - url: https://partner-docs.gupshup.io/docs/whatsapp-passthrough-apis-for-partners
    type: Documentation
  description: >-
    Token-authenticated Partner surface (partner.gupshup.io) for BSPs and resellers - manage apps, templates,
    subscriptions/callbacks, and send messages through Meta-format passthrough endpoints (e.g. POST /partner/app/{appId}/v3/message).
    Uses a partner token / app access token rather than the per-app apikey header.
