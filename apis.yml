apis:
- aid: gupshup:gupshup-sms-api
  name: Gupshup SMS API
  tags:
  - SMS
  - Messaging
  - Notification
  tags_raw:
  - SMS
  - Messaging
  - Notifications
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.gupshup.io/docs/sms-api-introduction
  baseURL: https://api.gupshup.io/sm/api/v1
  properties:
  - url: https://docs.gupshup.io/docs/sms-api-introduction
    type: Documentation
  - url: https://docs.gupshup.io/docs/send-message-to-single-number
    type: Documentation
  description: >-
    Broadcast SMS to a single number or many numbers programmatically via POST /msg on the /sm surface.
    Note - Gupshup has announced end-of-life for the /sm endpoints and recommends migrating SMS traffic
    to the /wa messaging surface.
- aid: gupshup:gupshup-rcs-api
  name: Gupshup RCS API
  tags:
  - RCS
  - Rich Messaging
  - Business Messaging
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://docs.gupshup.io/docs/rcs-api-introduction
  properties:
  - url: https://docs.gupshup.io/docs/rcs-api-introduction
    type: Documentation
  - url: https://docs.gupshup.io/docs/send-rcs-message
    type: APIReference
  description: >-
    Send RCS (Rich Communication Services) business messages - rich cards, carousels, suggested replies,
    and media. RCS is onboarding-gated (username / password issued by Gupshup) and served through the
    Gupshup Enterprise messaging gateway rather than the apikey-based api.gupshup.io REST surface.
- aid: gupshup:gupshup-partner-api
  name: Gupshup Partner API
  tags:
  - Partner
  - WhatsApp
  - Passthrough
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
